name: Android CI

on:
  push:
    branches: [ "main", "master", "kazakova", "ponamaryova" ]
    tags: [ '*-pz*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Запуск юнит-тестов
  unit-tests:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Выдача прав на исполнение gradlew
        run: chmod +x gradlew

      - name: Запуск юнит-тестов
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Отображение результатов тестов в GitHub UI
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/*.xml'
          check_name: Результаты Unit-тестов
          require_tests: true

      - name: Сохранение отчетов о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/jacoco/

  # 2. Статический анализ кода (Lint)
  lint:
    name: Статический анализ (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Выдача прав на исполнение gradlew
        run: chmod +x gradlew

      - name: Запуск Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Сохранение отчёта Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  # 3. Сборка Debug APK
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Выдача прав на исполнение gradlew
        run: chmod +x gradlew

      - name: Сборка Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # 4. Проверка на случайно слитые ключи/пароли
  secrets-scan:
    name: Поиск утечек секретов
    runs-on: ubuntu-latest
    steps:
      - name: Чтение истории Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Поиск закоммиченных ключей и паролей
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Публикация релиза на GitHub при сдаче тега (например 0104-pz02-kaz-v1)
  release:
    name: Создание GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [unit-tests, lint, build, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачивание собранного APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true