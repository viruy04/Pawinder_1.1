name: Android CI

on:
  push:
    branches:
      - master
      - kazakova
      - ponomaryova

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сборка проекта
        run: ./gradlew assembleDebug